name: Arch machine compiler
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  kernel_compiler:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Bootstrap container tools
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup depencies and Toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs "https://raw.githubusercontent.com/${{ github.repository_owner }}/linux_playground/refs/heads/main/toolchain.sh" | bash

      - name: Kernel setup and compile
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs "https://raw.githubusercontent.com/${{ github.repository_owner }}/linux_playground/refs/heads/main/kernel.sh" -o kernel.sh
          bash kernel.sh

      - name: Package AnyKernel3 for camellia
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz"
          git clone --depth=1 --branch camellia https://github.com/Anomali1304/AnyKernel3.git "${{ github.workspace }}/AnyKernel3"
          cp "${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz" "${{ github.workspace }}/AnyKernel3/Image.gz"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path.cwd() / "AnyKernel3"
          output = Path.cwd() / "Camellia-AnyKernel3-OC.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  if path.is_file() and ".git" not in path.relative_to(root).parts:
                      archive.write(path, path.relative_to(root))
          print(f"Created {output} ({output.stat().st_size} bytes)")
          PY
          test -s "${{ github.workspace }}/Camellia-AnyKernel3-OC.zip"

      - name: Upload flashable AnyKernel3 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Camellia-AnyKernel3-OC
          path: ${{ github.workspace }}/Camellia-AnyKernel3-OC.zip
          if-no-files-found: error
